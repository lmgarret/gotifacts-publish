name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck scripts/publish.sh
      - name: actionlint
        uses: raven-actions/actionlint@v2

  integration:
    name: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # gotifacts routes by Host and the apex (management + ingest) plane is the
      # base domain. Using "localhost" makes requests to localhost:8080 hit the
      # apex, so the ingest API is reachable in CI (port is ignored when matching).
      GOTIFACTS_IMAGE: ghcr.io/lmgarret/gotifacts:edge
      GOTIFACTS_BASE_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v6

      # gotifacts' GHCR package is private; authenticate the pull.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start gotifacts
        run: |
          docker volume create gtf-data
          docker pull "$GOTIFACTS_IMAGE"

          # Mint a key that can publish AND unpublish the "ci" group, against the
          # shared data volume. This exercises the granular-capability model:
          # preview teardown no longer needs an admin key.
          key="$(docker run --rm \
            -e GOTIFACTS_BASE_DOMAIN="$GOTIFACTS_BASE_DOMAIN" \
            -e GOTIFACTS_DATA_DIR=/data \
            -v gtf-data:/data \
            "$GOTIFACTS_IMAGE" \
            keys create --name ci --grant "ci:publish,unpublish" | grep -oE 'gtf_[A-Za-z0-9_-]+')"
          test -n "$key"
          echo "::add-mask::$key"
          echo "GOTIFACTS_API_KEY=$key" >> "$GITHUB_ENV"

          # Run the server against the same volume so the key is valid.
          # ADMIN_USERS/TRUSTED_PROXIES satisfy the "admins reachable" check so
          # serve doesn't refuse to start (the ingest plane uses the API key).
          docker run -d --name gotifacts -p 8080:8080 \
            -e GOTIFACTS_BASE_DOMAIN="$GOTIFACTS_BASE_DOMAIN" \
            -e GOTIFACTS_DATA_DIR=/data \
            -e GOTIFACTS_ADMIN_USERS=ci@example.com \
            -e GOTIFACTS_TRUSTED_PROXIES=127.0.0.1/32 \
            -e TMPDIR=/data \
            -v gtf-data:/data \
            "$GOTIFACTS_IMAGE"

          # Any HTTP response (not just 2xx) means the server is accepting
          # connections, so don't use curl -f here.
          for _ in $(seq 1 30); do
            if curl -sS -o /dev/null http://localhost:8080/; then
              echo "gotifacts is up"; exit 0
            fi
            sleep 1
          done
          echo "gotifacts did not become ready"; docker logs gotifacts; exit 1

      - name: Create a test site
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>ci</title><h1>hello from CI</h1>' > index.html

      - name: Publish via the action
        id: publish
        uses: ./
        with:
          url: http://localhost:8080
          api-key: ${{ env.GOTIFACTS_API_KEY }}
          path: index.html
          slug: ci-test
          group: ci
          title: CI Test

      - name: Assert the publish succeeded
        run: |
          test -n "${{ steps.publish.outputs.url }}" || { echo "no url output"; exit 1; }
          test -n "${{ steps.publish.outputs.updated-at }}" || { echo "no updated-at output"; exit 1; }
          echo "Published: ${{ steps.publish.outputs.url }}"

      - name: Unpublish via the action
        id: unpublish
        uses: ./
        with:
          command: unpublish
          url: http://localhost:8080
          api-key: ${{ env.GOTIFACTS_API_KEY }}
          slug: ci-test
          group: ci

      - name: Assert the unpublish succeeded
        run: |
          test "${{ steps.unpublish.outputs.deleted }}" = "true" \
            || { echo "expected deleted=true, got '${{ steps.unpublish.outputs.deleted }}'"; exit 1; }

      - name: Unpublish again (DELETE is idempotent)
        id: reunpublish
        uses: ./
        with:
          command: unpublish
          url: http://localhost:8080
          api-key: ${{ env.GOTIFACTS_API_KEY }}
          slug: ci-test
          group: ci

      - name: Assert the second unpublish is a no-op
        run: |
          test "${{ steps.reunpublish.outputs.deleted }}" = "false" \
            || { echo "expected deleted=false on second unpublish, got '${{ steps.reunpublish.outputs.deleted }}'"; exit 1; }

      - name: gotifacts logs (on failure)
        if: failure()
        run: docker logs gotifacts || true
