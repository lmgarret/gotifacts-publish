# Example consumer workflow: per-PR deploy previews on gotifacts.
# Publishes a preview on PR open/update and removes it when the PR closes.
# Copy into .github/workflows/ of your own repository.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Cancel superseded preview builds for the same PR.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to comment the preview URL

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build your static site into ./dist (must contain a top-level index.html).
      # - run: npm ci && npm run build

      - id: gotifacts
        uses: lmgarret/gotifacts-publish@v1
        with:
          url: ${{ secrets.GOTIFACTS_URL }}
          api-key: ${{ secrets.GOTIFACTS_API_KEY }}
          path: ./dist
          slug: pr-${{ github.event.pull_request.number }}
          group: previews
          title: PR #${{ github.event.pull_request.number }} preview
          repo: ${{ github.event.pull_request.html_url }}
          hidden: "true"

      - name: Comment the preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.gotifacts.outputs.url) }};
            const marker = '<!-- gotifacts-preview -->';
            const body = `${marker}\nPreview deployed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

  teardown-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: lmgarret/gotifacts-publish@v1
        with:
          command: unpublish
          url: ${{ secrets.GOTIFACTS_URL }}
          api-key: ${{ secrets.GOTIFACTS_API_KEY }}
          slug: pr-${{ github.event.pull_request.number }}
          group: previews
